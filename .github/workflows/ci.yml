name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatage
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Analyse
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Tests avec détection des accès concurrents
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Compilation
        run: go build ./cmd/gardien

  croisee:
    name: Compilation croisée
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cible:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ${{ matrix.cible.goos }}/${{ matrix.cible.goarch }}
        env:
          GOOS: ${{ matrix.cible.goos }}
          GOARCH: ${{ matrix.cible.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/gardien
